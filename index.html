<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>BOT GÀ CON 4.6 FULL FIX</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#000;color:#00ff66;font-family:monospace}
.app{max-width:420px;margin:auto;padding:15px;border:2px solid #00ff66}
input,button,select{width:100%;padding:10px;margin:6px 0;background:#000;border:1px solid #00ff66;color:#00ff66}
button.danger{border-color:#ff4444;color:#ff4444}
.box,.stats,.log{border:1px dashed #00ff66;padding:8px;margin:10px 0;font-size:13px}
.bet{border:2px dashed #00ff66;padding:10px;font-size:18px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gate{border:1px solid #00ff66;padding:14px;text-align:center}
.gate.sel{background:#003300}
.big{text-align:center;font-size:20px}
canvas{border:1px solid #00ff66;margin-top:10px}
</style>
</head>

<body>
<div class="app">

<!-- LOGIN -->
<div id="login">
<h2 class="big">🤖 BOT GÀ CON 4.6</h2>
<div>ID: <span id="deviceView"></span></div>
<input id="keyInput" placeholder="Nhập key">
<button onclick="checkKey()">XÁC NHẬN</button>
</div>

<!-- BOT -->
<div id="bot" style="display:none">
<div id="botMain" class="big"></div>
<div id="botSub" class="big"></div>
<div id="botSub2" class="big"></div>
<div id="betSuggest" class="bet"></div>
<div class="stats" id="stats"></div>

<select id="killer">
<option value="1">🐔 Gà</option>
<option value="2">🐍 Rắn</option>
<option value="4">⚡ Thần sấm</option>
</select>

<div class="grid" id="rooms"></div>
<button onclick="saveRound()">LƯU VÁN</button>
<button class="danger" onclick="resetBot()">RESET</button>

<canvas id="chart" width="360" height="180"></canvas>
<div class="log" id="logBox"><b>📜 NHẬT KÝ</b></div>
</div>
</div>

<script>
/* ================= CONFIG ================= */
const SERVER_URL="https://admin-key-server.onrender.com";

/* ================= DEVICE ================= */
function getDeviceId(){
 let id=localStorage.getItem("device_id");
 if(!id){
  id="DEV-"+Math.random().toString(36).slice(2,10);
  localStorage.setItem("device_id",id);
 }
 return id;
}
deviceView.innerText=getDeviceId();

/* ================= KEY ================= */
let KEY_TYPE="FREE", KEY_EXPIRE=0;
async function checkKey(){
 const key=keyInput.value.trim();
 const r=await fetch(SERVER_URL+"/check",{
  method:"POST",
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({key,device:getDeviceId()})
 });
 const d=await r.json();
 if(!d.ok) return alert(d.msg);
 KEY_TYPE=d.type;
 KEY_EXPIRE=d.expire;
 login.style.display="none";
 bot.style.display="block";
 drawRooms(); analyze();
}

/* ================= DATA ================= */
const ROOMS=["ANTOÀN","MAY MẮN","TỬ THẦN","BÍ ẨN","MẠO HIỂM"];
let data=JSON.parse(localStorage.getItem("gacon46"))||{
 rounds:[],win:0,lose:0,winStreak:0,loseStreak:0,last:0,log:[],lastBot:null
};
let selected=[],botPick="";
let roomHistory=JSON.parse(localStorage.getItem("roomHistory")||"{}");
ROOMS.forEach(r=>roomHistory[r]??={win:0,lose:0,loseStreak:0});

/* ================= ROOMS ================= */
function drawRooms(){
 rooms.innerHTML="";selected=[];
 ROOMS.forEach(r=>{
  let d=document.createElement("div");
  d.className="gate";d.innerText=r;
  d.onclick=()=>{
   if(d.classList.contains("sel")){
    d.classList.remove("sel");
    selected=selected.filter(x=>x!==r);
    return;
   }
   if(selected.length>=killer.value)return;
   d.classList.add("sel");selected.push(r);
  };
  rooms.appendChild(d);
 });
}

/* ================= BOT PHỤ 1 ================= */
function botPhuPick(main){
 let c=ROOMS.filter(r=>r!==main);
 let p=c[Math.floor(Math.random()*c.length)];
 let h=roomHistory[p];
 let trust=60+(h.win-h.lose)*2-h.loseStreak*8;
 return {room:p,trust:Math.max(25,Math.min(85,trust)).toFixed(1)};
}

/* ================= BOT PHỤ 2 – PHƯƠNG ÁN 1 ================= */
function botPhu2(room){
 let h=roomHistory[room];
 let score=100-h.loseStreak*20-h.lose*2+h.win*1.5;
 if(KEY_TYPE==="VIP") score+=10;

 let action="OK", lv="✅ AN TOÀN";
 if(score<35){ action="BLOCK"; lv="🚫 CẤM VÀO"; }
 else if(score<60){ action="LOW"; lv="⚠️ GIẢM CẦU"; }

 return {score:score.toFixed(1),lv,action};
}

/* ================= ANALYZE ================= */
function analyze(){
 if(data.rounds.length<3){
  botMain.innerText="🤖 BOT ĐANG HỌC";
  betSuggest.innerText="3 VÁN ĐẦU KHÔNG TÍNH";
  return;
 }

 let rate=Math.round(data.win/(data.win+data.lose)*100||0);

 /* SAFE MODE CHUẨN 4.6 */
 if(data.loseStreak>=4 || (data.winStreak>=5 && rate>80)){
  betSuggest.innerText="⛔ SAFE MODE – BOT NGHỈ";
  return;
 }

 do{
  botPick=ROOMS[Math.floor(Math.random()*ROOMS.length)];
 }while(botPick===data.lastBot);
 data.lastBot=botPick;

 let sub=botPhuPick(botPick);
 let p2=botPhu2(botPick);

 let bet="🟡 10%";
 if(rate<40) bet="🟢 5%";
 else if(rate>70) bet="🔴 30%";

 if(p2.action==="BLOCK") bet="🚫 KHÔNG VÀO";
 if(p2.action==="LOW") bet="🟡 GIẢM CẦU";

 botMain.innerText=`BOT CHÍNH: ${botPick} (${rate}%)`;
 botSub.innerText=`BOT PHỤ NÉ: ${sub.room} (${sub.trust}%)`;
 botSub2.innerText=`BOT PHỤ 2: ${p2.lv} (${p2.score}%)`;
 betSuggest.innerText=bet;

 stats.innerHTML=
 `🆔 ${getDeviceId()}<br>
 🔑 ${KEY_TYPE} | ⏳ ${new Date(KEY_EXPIRE).toLocaleString()}<br>
 🎯 ${data.rounds.length} ván | Win ${data.win} / Lose ${data.lose}`;
 drawChart();
}

/* ================= SAVE ================= */
function saveRound(){
 let result="WIN";
 if(selected.includes(botPick)){
  data.lose++;data.loseStreak++;data.winStreak=0;result="LOSE";
 }else{
  data.win++;data.winStreak++;data.loseStreak=0;
 }
 data.rounds.push([...selected]);
 data.log.push(`${result} | ${botPick}`);
 if(data.log.length>6)data.log.shift();
 selected.forEach(r=>{
  result==="WIN"?roomHistory[r].win++:roomHistory[r].lose++;
 });
 localStorage.setItem("gacon46",JSON.stringify(data));
 localStorage.setItem("roomHistory",JSON.stringify(roomHistory));
 logBox.innerHTML="<b>📜 NHẬT KÝ</b><br>"+data.log.join("<br>");
 drawRooms(); analyze();
}

/* ================= CHART ================= */
function drawChart(){
 let c=chart.getContext("2d");
 c.clearRect(0,0,360,180);
 let cnt={};ROOMS.forEach(r=>cnt[r]=0);
 data.rounds.flat().forEach(r=>cnt[r]++);
 let max=Math.max(...Object.values(cnt),1);
 ROOMS.forEach((r,i)=>{
  let h=(cnt[r]/max)*120;
  c.fillRect(20+i*65,160-h,40,h);
 });
}

/* ================= RESET ================= */
function resetBot(){
 localStorage.removeItem("gacon46");
 localStorage.removeItem("roomHistory");
 location.reload();
}
</script>
</body>
</html>
